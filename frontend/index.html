<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EMI Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">Loan planner</p>
        <h1>EMI Calculator</h1>
        <p class="lede">
          Enter the loan amount, interest rate, and tenure to see your monthly
          EMI, total interest, and a month-by-month breakup.
        </p>
      </header>

      <section class="layout">
        <form id="emi-form" class="card form-card">
          <h2>Loan details</h2>

          <label>
            Loan amount (₹)
            <input
              id="principal"
              name="principal"
              type="number"
              min="1"
              step="1"
              value="500000"
              required
            />
          </label>

          <label>
            Annual interest rate (%)
            <input
              id="annual-rate"
              name="annualRate"
              type="number"
              min="0"
              max="100"
              step="0.01"
              value="8.5"
              required
            />
          </label>

          <div class="tenure-row">
            <label>
              Tenure (years)
              <input
                id="years"
                name="years"
                type="number"
                min="0"
                step="1"
                value="5"
                required
              />
            </label>
            <label>
              Extra months
              <input
                id="months"
                name="months"
                type="number"
                min="0"
                max="11"
                step="1"
                value="0"
                required
              />
            </label>
          </div>

          <p id="form-error" class="error" hidden></p>
          <button type="submit">Calculate EMI</button>
        </form>

        <div class="card results-card" id="results" hidden>
          <h2>Results</h2>
          <dl class="stats">
            <div>
              <dt>Monthly EMI</dt>
              <dd id="emi-value">—</dd>
            </div>
            <div>
              <dt>Total interest</dt>
              <dd id="interest-value">—</dd>
            </div>
            <div>
              <dt>Total payable</dt>
              <dd id="total-value">—</dd>
            </div>
          </dl>
          <div class="chart-wrap">
            <canvas id="breakup-chart" aria-label="Principal versus interest chart"></canvas>
          </div>
        </div>
      </section>

      <section class="card table-card" id="schedule" hidden>
        <div class="table-header">
          <h2>Amortization schedule</h2>
          <p id="tenure-summary"></p>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Month</th>
                <th>EMI</th>
                <th>Principal</th>
                <th>Interest</th>
                <th>Balance</th>
              </tr>
            </thead>
            <tbody id="schedule-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="emi.js"></script>
    <script src="script.js"></script>
  </body>
</html>
